<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Googleなどの検索エンジンにインデックスさせない設定 -->
    <meta name="robots" content="noindex, nofollow">
    <title>売れる記事作成くん</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .hidden-step {
            display: none !important;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        /* テキスト選択を禁止する（コピー防止の補助） */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* 記事完成エリアだけは選択可能にする */
        #final-article-content, #history-article-body {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen flex justify-center py-10 px-4 font-sans text-gray-900 relative">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-sm border border-gray-300 overflow-hidden relative z-10">
        
        <!-- Header -->
        <div class="p-8 border-b border-gray-300">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <div class="bg-[#41C9B4] text-white font-bold px-3 py-1 rounded-full text-sm">note</div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-2xl font-bold">売れる記事作成くん</h1>
                        <div class="flex items-center justify-center w-10 h-10 transform rotate-12" title="PRO">
                             <svg viewBox="0 0 100 100" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#FFE066" />
                                        <stop offset="50%" stop-color="#F5B041" />
                                        <stop offset="100%" stop-color="#E67E22" />
                                    </linearGradient>
                                    <linearGradient id="note-green" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="#41C9B4" />
                                        <stop offset="100%" stop-color="#2c8d7e" />
                                    </linearGradient>
                                </defs>
                                <path d="M25 60 L15 95 L35 85 L50 95 L40 60 Z" fill="url(#note-green)"/>
                                <path d="M75 60 L85 95 L65 85 L50 95 L60 60 Z" fill="url(#note-green)"/>
                                <path d="M50 5 L60 12 L72 8 L78 19 L90 20 L91 32 L100 40 L95 50 L100 60 L91 68 L90 80 L78 81 L72 92 L60 88 L50 95 L40 88 L28 92 L22 81 L10 80 L9 68 L0 60 L5 50 L0 40 L9 32 L10 20 L22 19 L28 8 L40 12 Z" fill="url(#gold-grad)"/>
                                <circle cx="50" cy="50" r="28" fill="#FFFFFF" stroke="url(#gold-grad)" stroke-width="4"/>
                                <text x="50" y="65" font-size="11" font-weight="900" fill="#E67E22" text-anchor="middle">PRO</text>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="openHistoryModal()" class="text-gray-600 border-2 border-gray-300 rounded-full px-4 py-1.5 text-sm hover:bg-gray-50 transition-colors flex items-center gap-1 font-bold">
                        <i data-lucide="history" class="w-4 h-4"></i> 履歴
                    </button>
                    <button class="text-[#41C9B4] border-2 border-[#41C9B4] rounded-full px-4 py-1.5 text-sm hover:bg-teal-50 transition-colors flex items-center gap-1 font-bold">
                        noteログイン <i data-lucide="arrow-left" class="w-4 h-4 transform rotate-135"></i>
                    </button>
                </div>
            </div>
            <p class="text-gray-700 text-sm font-medium">プロフィール × カテゴリ × キーワードから、あなただけのオリジナル記事を生成します</p>
        </div>

        <div class="p-8">
            <div class="flex items-center justify-between w-full mb-8 relative" id="step-indicator"></div>
            <div id="error-message" class="hidden mb-6 p-4 bg-red-50 text-red-600 rounded-lg text-sm border border-red-200"></div>

            <div id="step-1" class="space-y-6 animate-fadeIn">
                <div>
                    <h2 class="text-lg font-bold mb-1">あなたのプロフィール</h2>
                    <p class="text-sm text-gray-700 mb-4">入力した情報がそのまま記事に反映されます。</p>
                </div>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">名前・ハンドル名</label>
                        <input type="text" id="input-name" placeholder="例：たけじい" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#41C9B4] transition-colors" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">職業・肩書き</label>
                        <input type="text" id="input-job" placeholder="例：フリーランスライター" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#41C9B4] transition-colors" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">経験・実績</label>
                        <textarea id="input-experience" placeholder="例：AI活用ツール開発が得意。" class="w-full border-2 border-gray-300 rounded-lg p-3 h-24 resize-none focus:outline-none focus:border-[#41C9B4] transition-colors"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">文体・キャラクター</label>
                        <input type="text" id="input-tone" placeholder="例：親しみやすい口語体" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#41C9B4] transition-colors" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">伝えたい強み</label>
                        <textarea id="input-strength" placeholder="例：初心者にも分かりやすく解説する" class="w-full border-2 border-gray-300 rounded-lg p-3 h-24 resize-none focus:outline-none focus:border-[#41C9B4] transition-colors"></textarea>
                    </div>
                </div>
                <div class="mt-8 flex justify-center">
                    <button id="btn-next-to-2" class="w-full max-w-md py-4 rounded-full font-bold flex justify-center items-center gap-2 transition-colors bg-[#41C9B4] text-white hover:bg-[#38b3a0] shadow-md">
                        次へ：カテゴリを選ぶ <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="step-2" class="hidden-step space-y-8 animate-fadeIn">
                <div id="category-container" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
                <div id="price-container" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>
                <div class="mt-8 flex justify-center gap-4">
                    <button onclick="goToStep(1)" class="px-8 py-3 rounded-full font-bold border-2 border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors">戻る</button>
                    <button id="btn-next-to-3" disabled class="flex-1 max-w-sm py-3 rounded-full font-bold flex justify-center items-center gap-2 bg-gray-300 text-gray-500 cursor-not-allowed">
                        次へ：キーワード <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="step-3" class="hidden-step space-y-6 animate-fadeIn max-w-2xl mx-auto">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold mb-2">何について書きますか？</h2>
                </div>
                <div>
                    <input type="text" id="input-keyword" placeholder="例：React初心者向け" class="w-full border-2 border-gray-300 rounded-xl p-4 text-lg text-center" />
                </div>
                <div class="mt-8 flex justify-center gap-4">
                    <button onclick="goToStep(2)" class="px-6 py-3 text-gray-700 hover:bg-gray-200 rounded-full font-bold">戻る</button>
                    <button id="btn-generate-ideas" disabled class="flex-1 max-w-sm py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-gray-300 text-gray-500">
                        記事候補を生成する <i data-lucide="bot" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="step-4" class="hidden-step space-y-6 animate-fadeIn">
                <div id="step-4-loading" class="hidden flex-col items-center justify-center py-20">
                    <i data-lucide="loader-2" class="animate-spin text-[#41C9B4] mb-4 w-12 h-12"></i>
                    <h2 class="text-xl font-bold">案を作成中...</h2>
                </div>
                <div id="step-4-content" class="hidden">
                    <div id="ideas-container" class="space-y-4"></div>
                    <div class="mt-8 flex justify-center gap-4">
                        <button onclick="goToStep(3)" class="px-6 py-3 text-gray-700 hover:bg-gray-200 rounded-full font-bold">やり直す</button>
                        <button id="btn-generate-article" disabled class="px-8 py-4 rounded-full font-bold bg-gray-300 text-gray-500">
                            この記事を執筆する <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div id="step-5" class="hidden-step space-y-6 animate-fadeIn">
                 <div id="step-5-loading" class="hidden flex-col items-center justify-center py-20">
                    <i data-lucide="loader-2" class="animate-spin text-[#41C9B4] mb-4 w-12 h-12"></i>
                    <h2 class="text-xl font-bold">執筆中...</h2>
                </div>
                <div id="step-5-content" class="hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-[#41C9B4]">完成！</h2>
                        <button onclick="copyToClipboard('final-article-content')" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-bold">コピー</button>
                    </div>
                    <div id="final-article-content" class="bg-gray-50 border-2 border-gray-300 rounded-xl p-6 whitespace-pre-wrap font-serif leading-relaxed max-h-[600px] overflow-y-auto"></div>
                    <div class="mt-8 flex justify-center">
                        <button onclick="resetApp()" class="px-6 py-3 text-gray-700 hover:bg-gray-200 rounded-full font-bold">最初から作り直す</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 履歴モーダル -->
    <div id="history-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center p-4 backdrop-blur-sm animate-fadeIn">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="history" class="w-5 h-5 text-[#41C9B4]"></i> 履歴</h2>
                <button onclick="closeHistoryModal()"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex flex-1 overflow-hidden h-[600px]">
                <div class="w-1/3 border-r border-gray-200 overflow-y-auto p-2" id="history-list"></div>
                <div class="w-2/3 flex flex-col bg-gray-50 overflow-hidden">
                    <div id="history-detail-empty" class="flex-1 flex flex-col items-center justify-center text-gray-400">
                        <p>履歴を選択してください</p>
                    </div>
                    <div id="history-detail-content" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                        <div class="p-4 border-b border-gray-200 bg-white flex justify-between items-center">
                            <h3 id="history-detail-title" class="font-bold text-gray-900 truncate"></h3>
                            <button onclick="copyToClipboard('history-article-body')" class="bg-[#41C9B4] text-white px-3 py-1.5 rounded-lg text-sm font-bold">コピー</button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-1 whitespace-pre-wrap font-serif leading-relaxed" id="history-article-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * セキュリティ対策：右クリック・ソース表示ショートカットの禁止
         */
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            // F12キー, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U を無効化
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
                (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });

        // --- 状態管理 ---
        let currentStep = 1;
        let formData = {
            name: '', jobTitle: '', experience: '', tone: '', strength: '',
            categoryId: '', priceId: '500_800', keyword: ''
        };
        let generatedIdeas = [];
        let selectedIdeaIndex = null;
        let finalArticle = '';

        const BACKEND_URL = "https://note-article-api.webrich60.deno.net";

        const CATEGORIES = [
            { id: 'business', label: 'ビジネス・副業', icon: 'briefcase', color: 'text-amber-700' },
            { id: 'tech', label: 'テック・AI', icon: 'bot', color: 'text-indigo-600' },
            { id: 'money', label: '投資・マネー', icon: 'circle-dollar-sign', color: 'text-yellow-600' },
            { id: 'career', label: 'キャリア・転職', icon: 'rocket', color: 'text-rose-600' },
            { id: 'creative', label: 'クリエイティブ', icon: 'palette', color: 'text-pink-600' },
            { id: 'lifestyle', label: 'ライフスタイル', icon: 'leaf', color: 'text-green-600' },
            { id: 'health', label: '健康・美容', icon: 'smile', color: 'text-orange-600' },
            { id: 'relationship', label: '恋愛・人間関係', icon: 'message-circle', color: 'text-purple-600' },
        ];

        const PRICE_TIERS = [
            { id: 'free', label: '無料', subLabel: '集客用' },
            { id: '300', label: '300円', subLabel: '入門' },
            { id: '500_800', label: '500〜800円', subLabel: '標準' },
            { id: '1000_2000', label: '1,000〜2,000円', subLabel: '専門' },
            { id: '3000_', label: '3,000円〜', subLabel: '極め' },
        ];

        function init() {
            lucide.createIcons();
            loadProfileFromStorage();
            renderStepIndicator();
            renderCategories();
            renderPrices();
            setupEventListeners();
        }

        function setupEventListeners() {
            ['name', 'jobTitle', 'experience', 'tone', 'strength'].forEach(key => {
                const id = 'input-' + (key === 'jobTitle' ? 'job' : key);
                document.getElementById(id).addEventListener('input', (e) => {
                    formData[key] = e.target.value;
                    saveProfileToStorage();
                    validateStep1();
                });
            });
            document.getElementById('input-keyword').addEventListener('input', (e) => {
                formData.keyword = e.target.value;
                validateStep3();
            });
            document.getElementById('btn-next-to-2').addEventListener('click', () => goToStep(2));
            document.getElementById('btn-next-to-3').addEventListener('click', () => goToStep(3));
            document.getElementById('btn-generate-ideas').addEventListener('click', handleGenerateIdeas);
            document.getElementById('btn-generate-article').addEventListener('click', handleGenerateArticle);
        }

        function saveProfileToStorage() { localStorage.setItem('articleCreatorProfile', JSON.stringify(formData)); }
        function loadProfileFromStorage() {
            const saved = localStorage.getItem('articleCreatorProfile');
            if (saved) {
                Object.assign(formData, JSON.parse(saved));
                ['name', 'jobTitle', 'experience', 'tone', 'strength'].forEach(key => {
                    const id = 'input-' + (key === 'jobTitle' ? 'job' : key);
                    const el = document.getElementById(id);
                    if(el) el.value = formData[key] || '';
                });
                validateStep1();
            }
        }

        function saveArticleToHistory(articleText, idea) {
            let history = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]');
            history.unshift({ id: Date.now().toString(), date: new Date().toLocaleString(), title: idea.title, content: articleText });
            if (history.length > 30) history.pop();
            localStorage.setItem('articleCreatorHistory', JSON.stringify(history));
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]');
            const listEl = document.getElementById('history-list');
            if (history.length === 0) { listEl.innerHTML = '<p class="p-4 text-gray-400">履歴はありません</p>'; return; }
            listEl.innerHTML = history.map(item => `
                <div onclick="showHistoryDetail('${item.id}')" class="p-3 mb-2 border rounded-lg hover:bg-teal-50 cursor-pointer">
                    <div class="text-[10px] text-gray-400">${item.date}</div>
                    <div class="text-sm font-bold truncate">${item.title}</div>
                </div>
            `).join('');
        }

        function showHistoryDetail(id) {
            const history = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]');
            const item = history.find(h => h.id === id);
            if (item) {
                document.getElementById('history-detail-empty').classList.add('hidden');
                document.getElementById('history-detail-content').classList.remove('hidden');
                document.getElementById('history-detail-title').innerText = item.title;
                document.getElementById('history-article-body').innerText = item.content;
            }
        }

        function openHistoryModal() { loadHistory(); document.getElementById('history-modal').classList.remove('hidden'); }
        function closeHistoryModal() { document.getElementById('history-modal').classList.add('hidden'); }

        function validateStep1() {
            const isValid = formData.name && formData.jobTitle && formData.experience;
            const btn = document.getElementById('btn-next-to-2');
            btn.disabled = !isValid;
            btn.className = isValid ? "w-full max-w-md py-4 rounded-full font-bold bg-[#41C9B4] text-white" : "w-full max-w-md py-4 rounded-full font-bold bg-gray-300 text-gray-500";
        }
        function validateStep2() {
            const isValid = !!formData.categoryId;
            const btn = document.getElementById('btn-next-to-3');
            btn.disabled = !isValid;
            btn.className = isValid ? "flex-1 max-w-sm py-3 rounded-full font-bold bg-[#41C9B4] text-white" : "flex-1 max-w-sm py-3 rounded-full font-bold bg-gray-300 text-gray-500";
        }
        function validateStep3() {
            const isValid = !!formData.keyword;
            const btn = document.getElementById('btn-generate-ideas');
            btn.disabled = !isValid;
            btn.className = isValid ? "flex-1 max-w-sm py-4 rounded-full font-bold bg-[#41C9B4] text-white" : "flex-1 max-w-sm py-4 rounded-full font-bold bg-gray-300 text-gray-500";
        }

        function renderStepIndicator() {
            const steps = ['プロフ', 'カテゴリ', 'キーワード', '案', '完成'];
            const container = document.getElementById('step-indicator');
            let html = '<div class="absolute left-0 top-1/2 w-full h-[2px] bg-gray-200 z-0"></div>';
            steps.forEach((label, i) => {
                const num = i + 1;
                const active = currentStep === num;
                const past = currentStep > num;
                html += `<div class="relative z-10 bg-white px-2 flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold ${active ? 'border-[#41C9B4] text-[#41C9B4]' : past ? 'bg-[#41C9B4] border-[#41C9B4] text-white' : 'border-gray-300 text-gray-400'}">${past ? '✓' : num}</div>
                    <span class="text-[10px] mt-1 ${active ? 'font-bold' : ''}">${label}</span>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = CATEGORIES.map(cat => `
                <button onclick="selectCategory('${cat.id}')" class="flex flex-col items-center p-3 border-2 rounded-xl transition-all ${formData.categoryId === cat.id ? 'border-[#41C9B4] bg-teal-50' : 'border-gray-100'}">
                    <i data-lucide="${cat.icon}" class="mb-1 w-6 h-6 ${cat.color}"></i>
                    <span class="text-[10px] font-bold">${cat.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }
        function renderPrices() {
            const container = document.getElementById('price-container');
            container.innerHTML = PRICE_TIERS.map(tier => `
                <button onclick="selectPrice('${tier.id}')" class="flex flex-col items-center p-2 border-2 rounded-xl transition-all ${formData.priceId === tier.id ? 'border-[#41C9B4] bg-teal-50' : 'border-gray-100'}">
                    <span class="text-xs font-bold">${tier.label}</span>
                    <span class="text-[8px] text-gray-400">${tier.subLabel}</span>
                </button>
            `).join('');
        }

        function selectCategory(id) { formData.categoryId = id; renderCategories(); validateStep2(); }
        function selectPrice(id) { formData.priceId = id; renderPrices(); }
        function goToStep(step) { currentStep = step; renderStepIndicator(); for(let i=1; i<=5; i++) { document.getElementById('step-'+i).classList.toggle('hidden-step', i !== step); } }

        async function callBackend(prompt, isJson = false) {
            const response = await fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, isJson }) });
            if (!response.ok) throw new Error("通信エラーが発生しました");
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            return isJson ? JSON.parse(text) : text;
        }

        async function handleGenerateIdeas() {
            goToStep(4);
            document.getElementById('step-4-loading').classList.remove('hidden');
            document.getElementById('step-4-content').classList.add('hidden');
            try {
                const cat = CATEGORIES.find(c=>c.id===formData.categoryId).label;
                const prompt = `${formData.name}(${formData.jobTitle})として、${formData.keyword}についてのnote記事案を3つ。カテゴリ：${cat}`;
                generatedIdeas = await callBackend(prompt, true);
                renderIdeas();
                document.getElementById('step-4-loading').classList.add('hidden');
                document.getElementById('step-4-content').classList.remove('hidden');
            } catch (e) { alert(e.message); goToStep(3); }
        }

        function renderIdeas() {
            const container = document.getElementById('ideas-container');
            container.innerHTML = generatedIdeas.map((idea, i) => `
                <div onclick="selectIdea(${i})" class="p-4 border-2 rounded-xl cursor-pointer transition-all ${selectedIdeaIndex === i ? 'border-[#41C9B4] bg-teal-50' : 'border-gray-100'}">
                    <h4 class="font-bold text-sm">${idea.title}</h4>
                    <p class="text-xs text-teal-600">${idea.catchphrase}</p>
                </div>
            `).join('');
        }
        function selectIdea(i) { selectedIdeaIndex = i; renderIdeas(); const btn = document.getElementById('btn-generate-article'); btn.disabled = false; btn.className = "px-8 py-4 rounded-full font-bold bg-[#41C9B4] text-white shadow-md"; }

        async function handleGenerateArticle() {
            goToStep(5);
            document.getElementById('step-5-loading').classList.remove('hidden');
            document.getElementById('step-5-content').classList.add('hidden');
            try {
                const idea = generatedIdeas[selectedIdeaIndex];
                const prompt = `${formData.name}として執筆：タイトル「${idea.title}」、構成「${idea.outline.join('、')}」`;
                finalArticle = await callBackend(prompt, false);
                document.getElementById('final-article-content').innerText = finalArticle;
                saveArticleToHistory(finalArticle, idea);
                document.getElementById('step-5-loading').classList.add('hidden');
                document.getElementById('step-5-content').classList.remove('hidden');
            } catch (e) { alert(e.message); goToStep(4); }
        }

        function resetApp() { formData.keyword = ''; document.getElementById('input-keyword').value = ''; selectedIdeaIndex = null; goToStep(1); }
        function copyToClipboard(id) {
            const text = document.getElementById(id).innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("コピー完了！");
        }

        init();
    </script>
</body>
</html>
