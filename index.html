<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>売れる記事作成くん PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        .hidden-step { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { user-select: none; }
        #final-article-content, #history-article-body { user-select: text; }
    </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen flex justify-center items-center py-6 sm:py-10 px-4 font-sans text-gray-900 relative">

    <!-- 🔑 ログイン画面 -->
    <div id="login-container" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-300 p-8 sm:p-10 flex flex-col items-center relative z-10 animate-fadeIn">
        <div class="w-16 h-16 bg-[#41C9B4] text-white rounded-full flex items-center justify-center mb-6 shadow-md">
            <i data-lucide="lock" class="w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2 text-gray-800">売れる記事作成くん</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">ログインして利用を開始してください。</p>
        
        <div class="w-full mb-6">
            <div class="flex justify-center mb-4 border-b border-gray-200">
                <button id="tab-register" onclick="switchAuthMode('register')" class="pb-2 px-4 font-bold text-[#41C9B4] border-b-2 border-[#41C9B4]">新規登録</button>
                <button id="tab-login" onclick="switchAuthMode('login')" class="pb-2 px-4 font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-colors">ログイン</button>
            </div>
            <div id="auth-error" class="hidden mb-3 p-3 bg-red-50 text-red-600 text-xs font-bold rounded-lg text-center border border-red-200"></div>
            <form id="email-auth-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">メールアドレス</label>
                    <input type="email" id="auth-email" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-[#41C9B4]" placeholder="email@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">パスワード</label>
                    <input type="password" id="auth-password" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-[#41C9B4]" placeholder="6文字以上">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-full font-bold bg-[#41C9B4] text-white hover:bg-[#38b3a0] shadow-md transition-colors">
                    新規登録
                </button>
            </form>
        </div>

        <div class="flex items-center w-full mb-6">
            <hr class="flex-grow border-gray-200"><span class="px-3 text-xs text-gray-400 font-bold">または</span><hr class="flex-grow border-gray-200">
        </div>

        <!-- Google Identity Services -->
        <div id="g_id_onload" 
             data-client_id="868927797743-0i5jc3jfiiis1a163qfd1qgp6gp8a8qi.apps.googleusercontent.com" 
             data-context="signin" 
             data-ux_mode="popup" 
             data-callback="handleCredentialResponse" 
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
    </div>

    <!-- 📝 アプリ本体 -->
    <div id="app-container" class="hidden w-full max-w-4xl bg-white rounded-2xl shadow-sm border border-gray-300 overflow-hidden relative z-10 self-start animate-fadeIn">
        <div class="p-6 sm:p-8 border-b border-gray-300">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <div class="bg-[#41C9B4] text-white font-bold px-2 py-1 rounded-full text-xs shrink-0">note</div>
                    <h1 class="text-lg sm:text-xl md:text-2xl font-bold">売れる記事作成くん PRO</h1>
                </div>
                <div class="flex items-center gap-2">
                    <img id="user-profile-img" src="" class="hidden w-9 h-9 rounded-full border-2 border-gray-300 shadow-sm shrink-0">
                    <button onclick="logout()" class="text-gray-400 hover:text-gray-600 transition-colors" title="ログアウト">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="w-full overflow-x-auto pb-2 mb-4 scrollbar-hide">
                <div class="flex items-center gap-2 flex-nowrap w-max">
                    <button onclick="openHistoryModal()" class="text-gray-600 border-2 border-gray-300 rounded-full px-4 py-2 text-sm hover:bg-gray-50 transition-colors flex items-center gap-1.5 font-bold whitespace-nowrap">
                        <i data-lucide="history" class="w-4 h-4"></i> 履歴
                    </button>
                    <button onclick="window.open('https://note.com/login', '_blank')" class="text-[#41C9B4] border-2 border-[#41C9B4] rounded-full px-4 py-2 text-sm hover:bg-teal-50 transition-colors flex items-center gap-1.5 font-bold whitespace-nowrap">
                        <i data-lucide="log-in" class="w-4 h-4"></i> noteログイン
                    </button>
                </div>
            </div>
            <p class="text-gray-700 text-xs sm:text-sm font-medium">プロフィールを使い分けて、最適な記事を生成しましょう</p>
        </div>

        <div class="p-6 sm:p-8">
            <div class="flex items-center justify-between w-full mb-8 relative" id="step-indicator"></div>

            <!-- ステップ1：プロフィール管理 -->
            <div id="step-1" class="space-y-6 animate-fadeIn">
                <div class="p-4 bg-teal-50 border border-teal-100 rounded-xl mb-6 shadow-inner">
                    <label class="block text-xs font-bold text-teal-800 mb-2 flex items-center gap-1">
                        <i data-lucide="users" class="w-4 h-4"></i> 保存済みのプロフィールを選択
                    </label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <select id="profile-select" onchange="loadSelectedProfile()" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-[#41C9B4] font-bold text-gray-700">
                            <option value="">-- 新しく入力する --</option>
                        </select>
                        <div class="flex gap-2">
                            <button onclick="saveCurrentProfile()" class="flex-1 sm:flex-none px-4 py-2 bg-[#41C9B4] text-white rounded-lg text-sm font-bold hover:bg-[#38b3a0] shadow-sm transition-colors whitespace-nowrap">
                                <i data-lucide="save" class="w-4 h-4 inline mr-1"></i>保存
                            </button>
                            <button onclick="deleteSelectedProfile()" class="px-3 py-2 border-2 border-red-200 text-red-500 rounded-lg text-sm font-bold hover:bg-red-50">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">名前・ハンドル名</label>
                        <input type="text" id="input-name" placeholder="例：たけじい" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#41C9B4]" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">職業・肩書き</label>
                        <input type="text" id="input-job" placeholder="例：フリーランスライター" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#41C9B4]" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">経験・実績</label>
                        <textarea id="input-experience" placeholder="例：AI活用ツール開発が得意。" class="w-full border-2 border-gray-300 rounded-lg p-3 h-24 resize-none focus:outline-none focus:border-[#41C9B4]"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">文体・キャラクター</label>
                        <input type="text" id="input-tone" placeholder="例：親しみやすい口語体" class="w-full border-2 border-gray-300 rounded-lg p-3 focus:outline-none focus:border-[#41C9B4]" />
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2 text-gray-800">伝えたい強み</label>
                        <textarea id="input-strength" placeholder="例：初心者にも分かりやすく解説する" class="w-full border-2 border-gray-300 rounded-lg p-3 h-24 resize-none focus:outline-none focus:border-[#41C9B4]"></textarea>
                    </div>
                </div>
                
                <div class="flex justify-end mt-4">
                    <button onclick="clearProfileForm()" class="px-4 py-2 text-xs font-bold text-gray-500 border-2 border-gray-300 rounded-full hover:bg-gray-100 transition-colors flex items-center gap-1">
                        <i data-lucide="eraser" class="w-3 h-3"></i> 入力欄クリア
                    </button>
                </div>

                <div class="mt-8 flex justify-center">
                    <button id="btn-next-to-2" class="w-full max-w-md py-4 rounded-full font-bold flex justify-center items-center gap-2 transition-colors bg-[#41C9B4] text-white hover:bg-[#38b3a0] shadow-md">
                        次へ：カテゴリを選ぶ <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- ステップ2：カテゴリ -->
            <div id="step-2" class="hidden-step space-y-8 animate-fadeIn">
                <div id="category-container" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
                <div id="price-container" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>
                <div class="mt-8 flex justify-center gap-4">
                    <button onclick="goToStep(1)" class="px-8 py-3 rounded-full font-bold border-2 border-gray-300 text-gray-700 hover:bg-gray-100 transition-colors">戻る</button>
                    <button id="btn-next-to-3" disabled class="flex-1 max-w-sm py-3 rounded-full font-bold bg-gray-300 text-gray-500 cursor-not-allowed">
                        次へ：キーワード <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- ステップ3：キーワード -->
            <div id="step-3" class="hidden-step space-y-6 animate-fadeIn max-w-2xl mx-auto">
                <div class="text-center mb-8"><h2 class="text-2xl font-bold mb-2">何について書きますか？</h2></div>
                <input type="text" id="input-keyword" placeholder="例：シニア向けの筋トレ術" class="w-full border-2 border-gray-300 rounded-xl p-4 text-lg text-center" />
                <div class="mt-8 flex justify-center gap-4">
                    <button onclick="goToStep(2)" class="px-6 py-3 text-gray-700 hover:bg-gray-200 rounded-full font-bold">戻る</button>
                    <button id="btn-generate-ideas" disabled class="flex-1 max-w-sm py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-gray-300 text-gray-500">
                        記事候補を生成する <i data-lucide="bot" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- ステップ4：案表示 -->
            <div id="step-4" class="hidden-step space-y-6 animate-fadeIn">
                <div id="step-4-loading" class="hidden flex flex-col items-center justify-center py-20">
                    <i data-lucide="loader-2" class="animate-spin text-[#41C9B4] mb-4 w-12 h-12"></i>
                    <h2 class="text-xl font-bold">案を作成中...</h2>
                </div>
                <div id="step-4-content" class="hidden">
                    <div id="ideas-container" class="space-y-4"></div>
                    <div class="mt-8 flex justify-center gap-4">
                        <button onclick="goToStep(3)" class="px-6 py-3 text-gray-700 hover:bg-gray-200 rounded-full font-bold">やり直す</button>
                        <button id="btn-generate-article" disabled class="px-8 py-4 rounded-full font-bold bg-gray-300 text-gray-500">この記事を執筆する</button>
                    </div>
                </div>
            </div>

            <!-- ステップ5：完成 -->
            <div id="step-5" class="hidden-step space-y-6 animate-fadeIn">
                <div id="step-5-loading" class="hidden flex flex-col items-center justify-center py-20">
                    <i data-lucide="loader-2" class="animate-spin text-[#41C9B4] mb-4 w-12 h-12"></i>
                    <h2 class="text-xl font-bold text-gray-700">記事を執筆中...</h2>
                </div>
                <div id="step-5-content" class="hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-[#41C9B4]">完成！</h2>
                        <button onclick="copyToClipboard('final-article-content')" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md">コピーする</button>
                    </div>
                    <div id="final-article-content" class="bg-gray-50 border-2 border-gray-300 rounded-xl p-6 whitespace-pre-wrap font-serif leading-relaxed max-h-[600px] overflow-y-auto"></div>
                    <div class="mt-8 flex justify-center"><button onclick="resetApp()" class="px-6 py-3 text-gray-700 hover:bg-gray-200 rounded-full font-bold transition-colors">最初から作る</button></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 履歴モーダル -->
    <div id="history-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="history" class="w-5 h-5 text-[#41C9B4]"></i> 履歴</h2>
                <button onclick="closeHistoryModal()"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div class="w-1/3 border-r border-gray-200 overflow-y-auto p-2" id="history-list"></div>
                <div class="w-2/3 flex flex-col bg-gray-50 overflow-hidden">
                    <div id="history-detail-empty" class="flex-1 flex flex-col items-center justify-center text-gray-400"><p>記事を選択してください</p></div>
                    <div id="history-detail-content" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                        <div class="p-4 border-b border-gray-200 bg-white flex justify-between items-center">
                            <h3 id="history-detail-title" class="font-bold text-gray-900 truncate"></h3>
                            <button onclick="copyToClipboard('history-article-body')" class="bg-[#41C9B4] text-white px-3 py-1.5 rounded-lg text-sm font-bold">コピー</button>
                        </div>
                        <div class="p-6 overflow-y-auto flex-1 whitespace-pre-wrap font-serif leading-relaxed" id="history-article-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Googleログインコールバック
        window.handleCredentialResponse = function(response) {
            try {
                const payload = JSON.parse(decodeURIComponent(escape(window.atob(response.credential.split('.')[1]))));
                loginSuccess({ name: payload.name, picture: payload.picture });
            } catch (e) { console.error("Login Error", e); }
        };

        // アプリの状態管理
        let currentStep = 1;
        let formData = { name: '', jobTitle: '', experience: '', tone: '', strength: '', categoryId: '', priceId: '500_800', keyword: '' };
        let savedProfiles = {};
        let generatedIdeas = [];
        let selectedIdeaIndex = null;
        const BACKEND_URL = "https://note-article-api.webrich60.deno.net";

        const CATEGORIES = [
            { id: 'business', label: 'ビジネス', icon: 'briefcase', color: 'text-amber-700' }, { id: 'tech', label: 'テック', icon: 'bot', color: 'text-indigo-600' },
            { id: 'money', label: 'マネー', icon: 'circle-dollar-sign', color: 'text-yellow-600' }, { id: 'career', label: 'キャリア', icon: 'rocket', color: 'text-rose-600' },
            { id: 'creative', label: '制作', icon: 'palette', color: 'text-pink-600' }, { id: 'lifestyle', label: '生活', icon: 'leaf', color: 'text-green-600' },
            { id: 'health', label: '健康', icon: 'smile', color: 'text-orange-600' }, { id: 'relationship', label: '人間関係', icon: 'message-circle', color: 'text-purple-600' }
        ];

        // 初期化と認証
        function init() { 
            lucide.createIcons(); 
            loadProfiles(); 
            renderStepIndicator(); 
            renderCategories(); 
            renderPrices(); 
            setupEvents(); 
            checkLogin(); 
        }

        function checkLogin() { if (localStorage.getItem('appLoggedIn') === 'true') { showApp(); } else { showLogin(); } }
        function showApp() { document.getElementById('login-container').classList.add('hidden'); document.getElementById('app-container').classList.remove('hidden'); document.body.classList.remove('items-center'); const u = JSON.parse(localStorage.getItem('appUserInfo') || '{}'); const img = document.getElementById('user-profile-img'); if (u.picture) { img.src = u.picture; img.classList.remove('hidden'); } }
        function showLogin() { document.getElementById('login-container').classList.remove('hidden'); document.getElementById('app-container').classList.add('hidden'); document.body.classList.add('items-center'); }
        function logout() { localStorage.removeItem('appLoggedIn'); showLogin(); }
        function loginSuccess(u) { localStorage.setItem('appLoggedIn', 'true'); localStorage.setItem('appUserInfo', JSON.stringify(u)); showApp(); }
        function handleEmailAuth(e) { e.preventDefault(); loginSuccess({ name: document.getElementById('auth-email').value.split('@')[0], picture: '' }); }
        function switchAuthMode(m) { document.getElementById('tab-register').className = m === 'register' ? "pb-2 px-4 font-bold text-[#41C9B4] border-b-2 border-[#41C9B4]" : "pb-2 px-4 font-bold text-gray-400 border-b-2 border-transparent"; document.getElementById('auth-submit-btn').innerText = m === 'register' ? "新規登録" : "ログイン"; }

        // プロフィール管理機能
        function loadProfiles() { const s = localStorage.getItem('articleProfilesList'); if (s) { try { savedProfiles = JSON.parse(s); } catch(e) { savedProfiles = {}; } } updateDropdown(); }
        function updateDropdown() { const sel = document.getElementById('profile-select'); const cur = sel.value; sel.innerHTML = '<option value="">-- 新規作成 --</option>'; for (const k in savedProfiles) { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); } if (savedProfiles[cur]) sel.value = cur; }
        function loadSelectedProfile() { const k = document.getElementById('profile-select').value; if (k && savedProfiles[k]) { Object.assign(formData, savedProfiles[k]); ['name', 'job', 'experience', 'tone', 'strength'].forEach(id => { const el = document.getElementById('input-' + id); const dk = id === 'job' ? 'jobTitle' : id; if(el) el.value = formData[dk] || ''; }); validate1(); } else { clearProfileForm(); } }
        function saveCurrentProfile() { if (!formData.name) { alert("「名前」を入力してください"); return; } let k = document.getElementById('profile-select').value || prompt("保存名（例：プロフ1）を入れてください", ""); if (!k) return; savedProfiles[k] = { ...formData }; localStorage.setItem('articleProfilesList', JSON.stringify(savedProfiles)); updateDropdown(); document.getElementById('profile-select').value = k; alert("プロフィールを保存しました！"); }
        function deleteSelectedProfile() { const k = document.getElementById('profile-select').value; if (!k) return; if (confirm(`「${k}」を削除してもよろしいですか？`)) { delete savedProfiles[k]; localStorage.setItem('articleProfilesList', JSON.stringify(savedProfiles)); updateDropdown(); clearProfileForm(); } }
        function clearProfileForm() { ['name', 'job', 'experience', 'tone', 'strength'].forEach(id => { const el = document.getElementById('input-' + id); if(el) el.value = ''; const dk = id === 'job' ? 'jobTitle' : id; formData[dk] = ''; }); validate1(); }

        // UIイベントとバリデーション
        function setupEvents() { 
            ['name', 'job', 'experience', 'tone', 'strength'].forEach(id => { 
                const el = document.getElementById('input-' + id);
                if (el) el.addEventListener('input', e => { formData[id==='job'?'jobTitle':id] = e.target.value; validate1(); }); 
            });
            const kwEl = document.getElementById('input-keyword');
            if (kwEl) kwEl.addEventListener('input', e => { formData.keyword = e.target.value; validate3(); });
            document.getElementById('btn-next-to-2').addEventListener('click', () => goToStep(2));
            document.getElementById('btn-generate-ideas').addEventListener('click', handleIdeas);
            document.getElementById('btn-generate-article').addEventListener('click', handleArticle);
        }
        function validate1() { const v = formData.name && formData.jobTitle && formData.experience; const b = document.getElementById('btn-next-to-2'); b.disabled = !v; b.className = v ? "w-full max-w-md py-4 rounded-full font-bold bg-[#41C9B4] text-white shadow-md transition-colors" : "w-full max-w-md py-4 rounded-full font-bold bg-gray-300 text-gray-500 cursor-not-allowed"; }
        function validate3() { const v = !!formData.keyword; const b = document.getElementById('btn-generate-ideas'); b.disabled = !v; b.className = v ? "flex-1 max-w-sm py-4 rounded-full font-bold bg-[#41C9B4] text-white shadow-md transition-colors" : "flex-1 max-w-sm py-4 rounded-full font-bold bg-gray-300 text-gray-500 cursor-not-allowed"; }
        
        // ステップ管理
        function goToStep(s) { currentStep = s; renderStepIndicator(); for(let i=1; i<=5; i++) { const el = document.getElementById('step-'+i); if(el) el.classList.toggle('hidden-step', i !== s); } window.scrollTo(0, 0); }
        function renderStepIndicator() { const s = ['プロフ', 'カテゴリ', 'キーワード', '案', '完成']; let h = '<div class="absolute left-0 top-1/2 w-full h-[1px] bg-gray-200"></div>'; s.forEach((l, i) => { const n = i + 1; const act = currentStep === n; const pas = currentStep > n; h += `<div class="relative z-10 bg-white px-1 flex flex-col items-center"><div class="w-7 h-7 rounded-full border-2 flex items-center justify-center font-bold text-xs ${act ? 'border-[#41C9B4] text-[#41C9B4]' : pas ? 'bg-[#41C9B4] border-[#41C9B4] text-white' : 'border-gray-300 text-gray-400'}">${pas?'✓':n}</div><span class="text-[9px] mt-1">${l}</span></div>`; }); document.getElementById('step-indicator').innerHTML = h; }
        
        function renderCategories() { document.getElementById('category-container').innerHTML = CATEGORIES.map(c => `<button onclick="selectCat('${c.id}')" class="flex flex-col items-center p-3 border-2 rounded-xl transition-all ${formData.categoryId===c.id?'border-[#41C9B4] bg-teal-50':'border-gray-100 hover:border-gray-300'}"><i data-lucide="${c.icon}" class="mb-1 w-5 h-5 ${c.color}"></i><span class="text-[10px] font-bold">${c.label}</span></button>`).join(''); lucide.createIcons(); }
        function selectCat(id) { formData.categoryId = id; renderCategories(); const b = document.getElementById('btn-next-to-3'); b.disabled = false; b.className = "flex-1 max-w-sm py-3 rounded-full font-bold bg-[#41C9B4] text-white shadow-md"; }
        function renderPrices() { const T = [{id:'free',l:'無料'},{id:'300',l:'300円'},{id:'500_800',l:'500円〜'},{id:'1000_2000',l:'1000円〜'},{id:'3000_',l:'3000円〜'}]; document.getElementById('price-container').innerHTML = T.map(t => `<button onclick="selectPrice('${t.id}')" class="p-2 border-2 rounded-xl text-[10px] font-bold ${formData.priceId===t.id?'border-[#41C9B4] bg-teal-50':'border-gray-100'}">${t.l}</button>`).join(''); }
        function selectPrice(id) { formData.priceId = id; renderPrices(); }

        // AI通信ロジック
        async function callAPI(p, j = false) {
            const r = await fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: p, isJson: j }) });
            if (!r.ok) throw new Error("通信に失敗しました");
            const d = await r.json();
            let t = d.candidates?.[0]?.content?.parts?.[0]?.text || d.text;
            if (j) {
                t = t.replace(/```json/g, '').replace(/```/g, '').trim();
                let p_obj = JSON.parse(t);
                return Array.isArray(p_obj) ? p_obj : [p_obj];
            }
            return t;
        }

        async function handleIdeas() { 
            goToStep(4); 
            document.getElementById('step-4-loading').classList.remove('hidden'); 
            document.getElementById('step-4-content').classList.add('hidden'); 
            try { 
                const cat = CATEGORIES.find(x=>x.id===formData.categoryId).label;
                const prompt = `ライター${formData.name}(${formData.jobTitle})として、${formData.keyword}のnote案を3つ。カテゴリ：${cat}。JSON配列のみ：[{"title":"案1","catchphrase":"キャッチ","outline":["見出し"]}]`;
                generatedIdeas = await callAPI(prompt, true); 
                renderIdeas(); 
                document.getElementById('step-4-loading').classList.add('hidden'); 
                document.getElementById('step-4-content').classList.remove('hidden'); 
            } catch (e) { alert("Error: " + e.message); goToStep(3); } 
        }

        function renderIdeas() { document.getElementById('ideas-container').innerHTML = generatedIdeas.map((idea, i) => `<div onclick="selectIdea(${i})" class="p-4 border-2 rounded-xl cursor-pointer ${selectedIdeaIndex===i?'border-[#41C9B4] bg-teal-50':'border-gray-100'}"><h4 class="font-bold text-sm">${idea.title}</h4><p class="text-xs text-teal-600">${idea.catchphrase}</p></div>`).join(''); }
        function selectIdea(i) { selectedIdeaIndex = i; renderIdeas(); const b = document.getElementById('btn-generate-article'); b.disabled = false; b.className = "px-8 py-4 rounded-full font-bold bg-[#41C9B4] text-white shadow-md"; }

        async function handleArticle() { 
            goToStep(5); 
            document.getElementById('step-5-loading').classList.remove('hidden'); 
            document.getElementById('step-5-content').classList.add('hidden'); 
            try { 
                const id = generatedIdeas[selectedIdeaIndex];
                const prompt = `${formData.name}として、タイトル「${id.title}」、構成「${id.outline.join('、')}」で記事を書いて。`;
                const art = await callAPI(prompt, false); 
                document.getElementById('final-article-content').innerText = art; 
                saveHistory(art, id); 
                document.getElementById('step-5-loading').classList.add('hidden'); 
                document.getElementById('step-5-content').classList.remove('hidden'); 
            } catch (e) { alert("Error: " + e.message); goToStep(4); } 
        }

        function saveHistory(t, idea) { let h = JSON.parse(localStorage.getItem('appHistory') || '[]'); h.unshift({ id: Date.now(), date: new Date().toLocaleString(), title: idea.title, content: t }); localStorage.setItem('appHistory', JSON.stringify(h.slice(0, 30))); }
        function openHistoryModal() { const h = JSON.parse(localStorage.getItem('appHistory') || '[]'); document.getElementById('history-list').innerHTML = h.map(i => `<div onclick="showHistory('${i.id}')" class="p-3 mb-2 border rounded-lg hover:bg-teal-50 cursor-pointer"><div class="text-[10px] text-gray-400">${i.date}</div><div class="text-sm font-bold truncate">${i.title}</div></div>`).join('') || '<p class="text-gray-400 p-4">履歴なし</p>'; document.getElementById('history-modal').classList.remove('hidden'); }
        function showHistory(id) { const h = JSON.parse(localStorage.getItem('appHistory') || '[]'); const i = h.find(x => x.id == id); document.getElementById('history-detail-empty').classList.add('hidden'); document.getElementById('history-detail-content').classList.remove('hidden'); document.getElementById('history-detail-title').innerText = i.title; document.getElementById('history-article-body').innerText = i.content; }
        function closeHistoryModal() { document.getElementById('history-modal').classList.add('hidden'); }
        function copyToClipboard(id) { const t = document.getElementById(id).innerText; navigator.clipboard.writeText(t); alert("コピー完了！"); }
        function resetApp() { formData.keyword = ''; document.getElementById('input-keyword').value = ''; selectedIdeaIndex = null; goToStep(1); }

        init();
    </script>
</body>
</html>
