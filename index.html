<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GoogleにINDEXされない設定 -->
    <meta name="robots" content="noindex, nofollow">
    <title>売れる記事作成くん PRO ver.3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slideDown { animation: slideDown 0.3s ease-out forwards; }
        .hidden-step { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        body { user-select: none; -webkit-user-select: none; }
        input, textarea { user-select: text; -webkit-user-select: text; }
        #history-article-body { user-select: text; -webkit-user-select: text; }
        input[type="radio"]:checked + div { border-color: #41C9B4; background-color: #F0FBFA; }
        input[type="radio"]:checked + div .radio-icon { color: #41C9B4; }
    </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen flex justify-center items-center py-6 sm:py-10 px-4 font-sans text-gray-900 relative">

    <!-- 🔔 共通エラーポップアップ -->
    <div id="alert-modal" class="hidden fixed inset-0 z-[100] flex justify-center items-start pt-20 bg-gray-900 bg-opacity-20 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl border border-red-200 p-6 max-w-sm w-full mx-4 animate-slideDown flex items-start gap-4">
            <div class="bg-red-100 text-red-500 rounded-full p-2 shrink-0"><i data-lucide="alert-circle" class="w-6 h-6"></i></div>
            <div class="flex-1">
                <h3 class="font-bold text-gray-900 mb-1">お知らせ</h3>
                <p id="alert-message" class="text-sm text-gray-600 mb-4"></p>
                <div class="flex justify-end"><button onclick="closeAlert()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2 rounded-lg text-sm font-bold transition-colors">閉じる</button></div>
            </div>
        </div>
    </div>

    <!-- 🔑 パスワード再設定 -->
    <div id="reset-modal" class="hidden fixed inset-0 z-50 flex justify-center items-center p-4 bg-gray-900 bg-opacity-50 backdrop-blur-sm animate-fadeIn">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
            <h2 class="text-xl font-bold mb-2 flex items-center gap-2 text-gray-800"><i data-lucide="key-round" class="text-[#41C9B4]"></i> パスワードの再設定</h2>
            <p class="text-xs text-gray-500 mb-6">登録メールアドレスと新しいパスワードを入力してください。</p>
            <form onsubmit="handlePasswordReset(event)" class="space-y-4">
                <div><label class="block text-xs font-bold text-gray-700 mb-1">登録メールアドレス</label><input type="email" id="reset-email" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-[#41C9B4]" placeholder="email@example.com"></div>
                <div><label class="block text-xs font-bold text-gray-700 mb-1">新しいパスワード</label><input type="password" id="reset-password" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-[#41C9B4]" placeholder="6文字以上"></div>
                <div class="flex gap-3 pt-4"><button type="button" onclick="closeResetModal()" class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-bold hover:bg-gray-200 transition-colors">キャンセル</button><button type="submit" class="flex-1 px-4 py-2.5 bg-[#41C9B4] text-white rounded-lg font-bold hover:bg-[#38b3a0] shadow-md transition-colors">再設定する</button></div>
            </form>
        </div>
    </div>

    <!-- 🔑 ログイン画面 -->
    <div id="login-container" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-300 p-8 sm:p-10 flex flex-col items-center relative z-10 animate-fadeIn">
        <div class="w-16 h-16 bg-[#41C9B4] text-white rounded-full flex items-center justify-center mb-6 shadow-md"><i data-lucide="lock" class="w-8 h-8"></i></div>
        <h1 class="text-2xl font-bold mb-2 text-gray-800 flex items-baseline gap-2">売れる記事作成くん PRO <span class="text-sm font-normal text-[#41C9B4]">ver.3.0</span></h1>
        <p class="text-sm text-gray-500 mb-6 text-center">ログインして利用を開始してください。</p>
        <div class="w-full mb-6">
            <div class="flex justify-center mb-4 border-b border-gray-200">
                <button id="tab-register" onclick="switchAuthMode('register')" class="pb-2 px-4 font-bold text-[#41C9B4] border-b-2 border-[#41C9B4]">新規登録</button>
                <button id="tab-login" onclick="switchAuthMode('login')" class="pb-2 px-4 font-bold text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-colors">ログイン</button>
            </div>
            <form id="email-auth-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
                <div><label class="block text-xs font-bold text-gray-700 mb-1">メールアドレス</label><input type="email" id="auth-email" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-[#41C9B4]" placeholder="email@example.com"></div>
                <div><label class="block text-xs font-bold text-gray-700 mb-1">パスワード</label><input type="password" id="auth-password" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:border-[#41C9B4]" placeholder="6文字以上"></div>
                <div id="forgot-password-container" class="hidden text-right"><button type="button" onclick="showResetModal()" class="text-xs text-[#41C9B4] font-bold hover:underline">パスワードを忘れた方</button></div>
                <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-full font-bold bg-[#41C9B4] text-white hover:bg-[#38b3a0] shadow-md transition-colors">新規登録</button>
            </form>
        </div>
        <div class="flex items-center w-full mb-6"><hr class="flex-grow border-gray-200"><span class="px-3 text-xs text-gray-400 font-bold">または</span><hr class="flex-grow border-gray-200"></div>
        <div id="g_id_onload" data-client_id="868927797743-0i5jc3jfiiis1a163qfd1qgp6gp8a8qi.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
    </div>

    <!-- 📝 アプリ本体 -->
    <div id="app-container" class="hidden w-full max-w-4xl bg-white rounded-2xl shadow-sm border border-gray-300 overflow-hidden relative z-10 self-start animate-fadeIn">
        <div class="p-6 sm:p-8 border-b border-gray-300 bg-white">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2"><div class="bg-[#41C9B4] text-white font-bold px-2 py-1 rounded-full text-xs shrink-0">note</div><h1 class="text-lg sm:text-xl md:text-2xl font-bold flex items-baseline gap-2">売れる記事作成くん PRO <span class="text-sm font-normal text-[#41C9B4]">ver.3.0</span></h1></div>
                <div class="flex items-center gap-3"><img id="user-profile-img" src="" class="hidden w-9 h-9 rounded-full border-2 border-gray-300 shadow-sm shrink-0"><button onclick="logout()" class="text-gray-600 bg-white border-2 border-gray-300 rounded-full px-4 py-2 text-sm hover:bg-gray-100 hover:text-gray-800 transition-colors flex items-center gap-2 font-bold whitespace-nowrap shadow-sm" title="ログアウト"><i data-lucide="log-out" class="w-4 h-4"></i> ログアウト</button></div>
            </div>
            <div class="w-full overflow-x-auto pb-2 mb-4 scrollbar-hide"><div class="flex items-center gap-2 flex-nowrap w-max"><button onclick="openHistoryModal()" class="text-gray-600 border-2 border-gray-300 rounded-full px-4 py-2 text-sm hover:bg-gray-50 transition-colors flex items-center gap-1.5 font-bold whitespace-nowrap"><i data-lucide="history" class="w-4 h-4"></i> 履歴管理</button><button onclick="window.open('https://note.com/login', '_blank')" class="text-[#41C9B4] border-2 border-[#41C9B4] rounded-full px-4 py-2 text-sm hover:bg-teal-50 transition-colors flex items-center gap-1.5 font-bold whitespace-nowrap"><i data-lucide="log-in" class="w-4 h-4"></i> noteへ</button></div></div>
            <p class="text-gray-700 text-xs sm:text-sm font-medium">プロフィールを使い分けて、最適な記事を生成しましょう</p>
        </div>

        <div class="p-6 sm:p-8 bg-[#F8F9FA]">
            <div class="flex items-center justify-between w-full mb-8 relative" id="step-indicator"></div>

            <!-- ステップ1 -->
            <div id="step-1" class="space-y-6 animate-fadeIn">
                <div class="p-4 bg-white border border-gray-200 rounded-xl mb-6 shadow-sm">
                    <label class="block text-xs font-bold text-gray-700 mb-2 flex justify-between items-center"><span class="flex items-center gap-1 text-[#41C9B4]"><i data-lucide="users" class="w-4 h-4"></i> 保存済みのプロフを呼び出す</span><div class="flex gap-2"><button onclick="exportData('articleProfilesList', 'profiles.json')" class="text-[10px] text-gray-500 bg-white border border-gray-300 px-2 py-0.5 rounded shadow-sm hover:bg-gray-50 flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i>保存(DL)</button><button onclick="importData('articleProfilesList', loadProfilesList)" class="text-[10px] text-gray-500 bg-white border border-gray-300 px-2 py-0.5 rounded shadow-sm hover:bg-gray-50 flex items-center gap-1"><i data-lucide="upload" class="w-3 h-3"></i>復元(UP)</button></div></label>
                    <div class="flex flex-col sm:flex-row gap-2"><select id="profile-select" onchange="loadSelectedProfile()" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-[#41C9B4] font-bold text-gray-700 bg-gray-50"><option value="">-- 新規作成 --</option></select><div class="flex gap-2"><button onclick="saveCurrentProfile()" class="flex-1 sm:flex-none px-5 py-2 bg-white border-2 border-[#41C9B4] text-[#41C9B4] rounded-lg text-sm font-bold hover:bg-teal-50 transition-colors whitespace-nowrap flex items-center justify-center gap-1"><i data-lucide="save" class="w-4 h-4"></i>保存する</button><button onclick="deleteSelectedProfile()" class="px-3 py-2 border-2 border-red-200 text-red-500 rounded-lg text-sm font-bold hover:bg-red-50 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>
                </div>
                <div class="bg-[#Fdfcf7] border border-amber-200 p-5 sm:p-6 rounded-xl shadow-sm"><h3 class="font-bold text-amber-800 flex items-center gap-2 mb-5 border-b border-amber-200 pb-2"><i data-lucide="user-circle" class="w-5 h-5"></i> 基本プロフィール</h3><div class="space-y-5"><div class="grid grid-cols-1 sm:grid-cols-2 gap-5"><div><label class="block text-sm font-bold mb-1 text-gray-800">名前 <span class="text-[10px] text-red-500 ml-1">必須</span></label><input type="text" id="input-name" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-400" placeholder="たけじい" /></div><div><label class="block text-sm font-bold mb-1 text-gray-800">職業 <span class="text-[10px] text-red-500 ml-1">必須</span></label><input type="text" id="input-job" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-400" placeholder="フリーランスライター" /></div></div><div><label class="block text-sm font-bold mb-1 text-gray-800">経験・実績 <span class="text-[10px] text-red-500 ml-1">必須</span></label><textarea id="input-experience" class="w-full border border-gray-300 rounded-lg p-3 h-20 text-sm resize-none focus:outline-none focus:border-amber-400" placeholder="AIツール開発、10年以上の経験など"></textarea></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-5"><div><label class="block text-sm font-bold mb-1 text-gray-800">文体 <span class="text-gray-400 text-[10px] ml-1">任意</span></label><input type="text" id="input-tone" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-400" placeholder="親しみやすい口語体" /></div><div><label class="block text-sm font-bold mb-1 text-gray-800">伝えたい強み <span class="text-gray-400 text-[10px] ml-1">任意</span></label><input type="text" id="input-strength" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-400" placeholder="初心者にもわかりやすく" /></div></div></div></div>
                <div class="bg-[#fffcfd] border border-rose-200 p-5 sm:p-6 rounded-xl shadow-sm"><h3 class="font-bold text-rose-800 flex items-center gap-2 mb-5 border-b border-rose-200 pb-2"><i data-lucide="sparkles" class="w-5 h-5 text-pink-500"></i> 追加項目 <span class="text-[10px] bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full font-normal">任意</span></h3><div class="space-y-6"><div><label class="block text-sm font-bold mb-1 text-gray-800">ニッチなテーマ Top3</label><textarea id="input-niche" class="w-full border border-gray-300 rounded-lg p-3 h-16 text-sm resize-none focus:outline-none focus:border-rose-400" placeholder="独自の視点を書くと熱量が出ます"></textarea></div><div><label class="block text-sm font-bold mb-2 text-gray-800">理想の読後感</label><div class="flex flex-wrap gap-x-4 gap-y-2 mb-2"><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="aftertaste" value="発見" class="w-4 h-4 text-rose-500"> 発見</label><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="aftertaste" value="行動" class="w-4 h-4 text-rose-500"> 行動</label><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="aftertaste" value="共感" checked class="w-4 h-4 text-rose-500"> 共感</label><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="aftertaste" value="安心" class="w-4 h-4 text-rose-500"> 安心</label><label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="radio" name="aftertaste" value="その他" class="w-4 h-4 text-rose-500"> その他</label></div><input type="text" id="input-aftertaste-other" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-rose-400 bg-white" placeholder="その他を選んだ場合" /></div><div><label class="block text-sm font-bold mb-1 text-gray-800">禁止ワード</label><textarea id="input-forbidden" class="w-full border border-gray-300 rounded-lg p-3 h-16 text-sm resize-none focus:outline-none focus:border-rose-400" placeholder="〜すべき、絶対になど、自分らしくない言葉"></textarea></div></div></div>
                <div class="flex justify-end mt-4"><button onclick="clearProfileForm()" class="px-4 py-2 text-xs font-bold text-gray-500 bg-white border border-gray-300 rounded-full hover:bg-gray-100 transition-colors flex items-center gap-1 shadow-sm"><i data-lucide="eraser" class="w-3 h-3"></i> 内容をクリア</button></div>
                <div class="mt-8 flex justify-center"><button id="btn-next-to-2" class="w-full max-w-md py-4 rounded-full font-bold flex justify-center items-center gap-2 transition-colors bg-gray-300 text-gray-500 cursor-not-allowed shadow-none"><span>次へ：カテゴリを選ぶ</span> <i data-lucide="chevron-right" class="w-5 h-5"></i></button></div>
            </div>

            <!-- ステップ2 -->
            <div id="step-2" class="hidden-step space-y-8 animate-fadeIn">
                <div id="category-container" class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-white p-6 rounded-xl shadow-sm border border-gray-200"></div>
                <div id="price-container" class="grid grid-cols-2 md:grid-cols-5 gap-3 bg-white p-6 rounded-xl shadow-sm border border-gray-200"></div>
                <div class="mt-8 flex justify-center gap-4"><button onclick="goToStep(1)" class="px-8 py-3 rounded-full font-bold border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 transition-colors shadow-sm">戻る</button><button id="btn-next-to-3" disabled class="flex-1 max-w-sm py-3 rounded-full font-bold bg-gray-300 text-gray-500 cursor-not-allowed flex justify-center items-center gap-2 shadow-none"><span>次へ：キーワード</span> <i data-lucide="chevron-right" class="w-5 h-5"></i></button></div>
            </div>

            <!-- ステップ3 -->
            <div id="step-3" class="hidden-step space-y-6 animate-fadeIn max-w-2xl mx-auto">
                <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200">
                    <div class="text-center mb-6"><h2 class="text-xl font-bold mb-2 text-gray-800 flex items-center justify-center gap-2"><i data-lucide="pen-tool" class="w-6 h-6 text-[#41C9B4]"></i> 何について書きますか？</h2></div>
                    <input type="text" id="input-keyword" placeholder="例：シニア向けの筋トレ術" class="w-full border-2 border-gray-300 rounded-xl p-4 text-lg text-center focus:outline-none focus:border-[#41C9B4] transition-colors mb-4" />
                    
                    <!-- キーワード提案 -->
                    <div class="mb-8 bg-teal-50 border border-teal-100 rounded-xl p-4">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-3 gap-2"><span class="text-sm font-bold text-teal-800 flex items-center gap-1"><i data-lucide="lightbulb" class="w-4 h-4"></i> キーワードに迷ったら？</span><button type="button" onclick="suggestKeywords()" class="text-xs bg-white border border-teal-300 text-teal-700 px-3 py-1.5 rounded-full hover:bg-teal-100 shadow-sm flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3"></i> AIに提案してもらう</button></div>
                        <div id="keyword-suggestions-container" class="hidden mt-4 pt-3 border-t border-teal-200"></div>
                    </div>
                    
                    <!-- アプローチ選択 -->
                    <div class="text-left border-t border-gray-100 pt-6">
                        <label class="block text-sm font-bold mb-3 text-gray-800 flex items-center gap-2"><i data-lucide="target" class="w-5 h-5 text-indigo-500"></i> どのようなアプローチで書きますか？</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <label class="block relative cursor-pointer group"><input type="radio" name="approach" value="empathy" checked class="peer sr-only"><div class="p-4 border-2 border-gray-200 rounded-xl transition-all peer-checked:border-[#41C9B4] hover:border-gray-300 h-full"><div class="flex items-center gap-2 mb-1"><i data-lucide="heart-handshake" class="w-4 h-4 text-pink-500 radio-icon text-gray-400"></i><div class="font-bold text-sm text-gray-800">感情・ストーリー</div></div><div class="text-[10px] text-gray-500 ml-6">読者の悩みに寄り添う共感重視</div></div></label>
                            <label class="block relative cursor-pointer group"><input type="radio" name="approach" value="authority" class="peer sr-only"><div class="p-4 border-2 border-gray-200 rounded-xl transition-all peer-checked:border-[#41C9B4] hover:border-gray-300 h-full"><div class="flex items-center gap-2 mb-1"><i data-lucide="book-open-check" class="w-4 h-4 text-indigo-500 radio-icon text-gray-400"></i><div class="font-bold text-sm text-gray-800">論理・ノウハウ</div></div><div class="text-[10px] text-gray-500 ml-6">圧倒的な実績をベースにした専門性</div></div></label>
                            <label class="block relative cursor-pointer group"><input type="radio" name="approach" value="controversy" class="peer sr-only"><div class="p-4 border-2 border-gray-200 rounded-xl transition-all peer-checked:border-[#41C9B4] hover:border-gray-300 h-full"><div class="flex items-center gap-2 mb-1"><i data-lucide="flame" class="w-4 h-4 text-orange-500 radio-icon text-gray-400"></i><div class="font-bold text-sm text-gray-800">反常識・バズ</div></div><div class="text-[10px] text-gray-500 ml-6">「〇〇はするな」のような強い主張</div></div></label>
                            <label class="block relative cursor-pointer group"><input type="radio" name="approach" value="column" class="peer sr-only"><div class="p-4 border-2 border-gray-200 rounded-xl transition-all peer-checked:border-[#41C9B4] hover:border-gray-300 h-full"><div class="flex items-center gap-2 mb-1"><i data-lucide="coffee" class="w-4 h-4 text-amber-600 radio-icon text-gray-400"></i><div class="font-bold text-sm text-gray-800">コラム・独り言</div></div><div class="text-[10px] text-gray-500 ml-6">人柄や独自の考え方をゆるく伝える</div></div></label>
                        </div>
                    </div>
                </div>
                <div class="mt-8 flex justify-center gap-4"><button onclick="goToStep(2)" class="px-6 py-3 text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-full font-bold shadow-sm">戻る</button><button id="btn-generate-ideas" disabled class="flex-1 max-w-sm py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-gray-300 text-gray-500 shadow-none"><span>記事候補を生成する</span> <i data-lucide="bot" class="w-5 h-5"></i></button></div>
            </div>

            <!-- ステップ4 -->
            <div id="step-4" class="hidden-step space-y-6 animate-fadeIn">
                <div id="step-4-loading" class="hidden flex-col items-center justify-center py-20"><div class="relative"><i data-lucide="bot" class="w-16 h-16 text-[#41C9B4] animate-bounce"></i><i data-lucide="loader-2" class="absolute -bottom-4 -right-4 animate-spin text-amber-500 w-8 h-8"></i></div><h2 class="text-xl font-bold mt-6 text-gray-700">プロの切り口で案を作成中...</h2></div>
                <div id="step-4-content" class="hidden"><div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6"><h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i> AI構成案</h3><div id="ideas-container" class="space-y-4"></div></div><div class="mt-8 flex justify-center gap-4"><button onclick="goToStep(3)" class="px-6 py-3 text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-full font-bold shadow-sm">やり直す</button><button id="btn-generate-article" disabled class="px-8 py-4 rounded-full font-bold bg-gray-300 text-gray-500 flex justify-center items-center gap-2 shadow-sm"><span>記事を執筆する</span> <i data-lucide="chevron-right" class="w-5 h-5"></i></button></div></div>
            </div>

            <!-- ステップ5 -->
            <div id="step-5" class="hidden-step space-y-6 animate-fadeIn">
                <div id="step-5-loading" class="hidden flex-col items-center justify-center py-20"><div class="relative"><i data-lucide="file-text" class="w-16 h-16 text-[#41C9B4] animate-pulse"></i><i data-lucide="loader-2" class="absolute -bottom-4 -right-4 animate-spin text-rose-500 w-8 h-8"></i></div><h2 class="text-xl font-bold mt-6 text-gray-700">執筆中...</h2></div>
                <div id="step-5-content" class="hidden"><div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200"><div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-gray-200 gap-4"><div><h2 class="text-xl font-bold text-[#41C9B4] flex items-center gap-2"><i data-lucide="check-circle-2" class="w-6 h-6"></i> 完成！</h2><p class="text-xs text-gray-500 mt-1">下の枠内で直接編集できます。整えたらコピーしてください。</p></div><button onclick="copyToClipboard('final-article-content')" class="bg-gray-800 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md flex items-center gap-2 hover:bg-gray-700 transition-colors w-full sm:w-auto justify-center"><i data-lucide="copy" class="w-4 h-4"></i> コピーする</button></div><textarea id="final-article-content" class="w-full bg-gray-50 border border-gray-300 rounded-xl p-6 whitespace-pre-wrap font-serif leading-loose min-h-[500px] resize-y text-gray-800 text-base focus:outline-none focus:border-[#41C9B4] focus:ring-2 focus:ring-[#41C9B4] focus:bg-white transition-all"></textarea></div><div class="mt-8 flex justify-center"><button onclick="resetApp()" class="px-8 py-3 text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-full font-bold shadow-sm transition-colors">最初から作る</button></div></div>
            </div>
        </div>
    </div>

    <!-- 履歴モーダル -->
    <div id="history-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 z-50 flex justify-center items-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <div class="flex items-center gap-4"><h2 class="text-xl font-bold flex items-center gap-2 text-gray-800"><i data-lucide="history" class="w-5 h-5 text-[#41C9B4]"></i> 作成履歴</h2><div class="flex gap-2 ml-4 border-l border-gray-300 pl-4"><button onclick="exportData('articleCreatorHistory', 'history.json')" class="text-xs text-gray-600 bg-white border border-gray-300 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 flex items-center gap-1"><i data-lucide="download" class="w-3 h-3"></i>保存(DL)</button><button onclick="importData('articleCreatorHistory', openHistoryModal)" class="text-xs text-gray-600 bg-white border border-gray-300 px-3 py-1.5 rounded shadow-sm hover:bg-gray-100 flex items-center gap-1"><i data-lucide="upload" class="w-3 h-3"></i>復元(UP)</button></div></div>
                <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-gray-600 bg-white rounded-full p-1 border border-gray-200"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex flex-col md:flex-row flex-1 overflow-hidden h-[600px]">
                <div class="w-full md:w-1/3 border-r border-gray-200 overflow-y-auto p-3 bg-gray-50" id="history-list"></div>
                <div class="w-full md:w-2/3 flex flex-col bg-white overflow-hidden">
                    <div id="history-detail-empty" class="flex-1 flex flex-col items-center justify-center text-gray-400"><i data-lucide="file-search" class="w-12 h-12 mb-3 text-gray-300"></i><p>左のリストから記事を選択してください</p></div>
                    <div id="history-detail-content" class="hidden flex-1 flex flex-col h-full overflow-hidden animate-fadeIn">
                        <div class="p-4 border-b border-gray-200 bg-white flex justify-between items-center shadow-sm z-10"><h3 id="history-detail-title" class="font-bold text-gray-900 truncate pr-4 text-lg"></h3><button onclick="copyHistoryToClipboard()" class="bg-[#41C9B4] text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm flex items-center gap-1.5 shrink-0 hover:bg-[#38b3a0]"><i data-lucide="copy" class="w-4 h-4"></i> コピー</button></div>
                        <div class="p-6 md:p-8 overflow-y-auto flex-1 whitespace-pre-wrap font-serif leading-loose text-gray-800 text-base" id="history-article-body"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 🔒 セキュリティ
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) { e.preventDefault(); return false; } });

        function showAlert(m) { document.getElementById('alert-message').innerText = m; const modal = document.getElementById('alert-modal'); modal.classList.remove('hidden'); setTimeout(() => closeAlert(), 3000); }
        function closeAlert() { document.getElementById('alert-modal').classList.add('hidden'); }

        function showResetModal() { document.getElementById('reset-modal').classList.remove('hidden'); }
        function closeResetModal() { document.getElementById('reset-modal').classList.add('hidden'); document.getElementById('reset-email').value = ''; document.getElementById('reset-password').value = ''; }
        function handlePasswordReset(e) { e.preventDefault(); const em = document.getElementById('reset-email').value; const np = document.getElementById('reset-password').value; let us = JSON.parse(localStorage.getItem('appUsers') || '{}'); if (!us[em]) { showAlert("登録されていません。"); return; } if (np.length < 6) { showAlert("6文字以上。"); return; } us[em].password = np; localStorage.setItem('appUsers', JSON.stringify(us)); closeResetModal(); showAlert("再設定完了。"); }

        window.handleCredentialResponse = function(r) { try { const p = JSON.parse(decodeURIComponent(escape(window.atob(r.credential.split('.')[1])))); loginSuccess({ name: p.name, picture: p.picture }); } catch (e) { console.error("Error", e); } };

        let currentStep = 1;
        let formData = { name: '', jobTitle: '', experience: '', tone: '', strength: '', nicheThemes: '', aftertaste: '共感', aftertasteOther: '', forbiddenWords: '', categoryId: '', priceId: '500_800', keyword: '', approach: 'empathy', suggestedTags: '' };
        let savedProfiles = {}; let generatedIdeas = []; let selectedIdeaIndex = null; let authMode = 'register';
        const BACKEND_URL = "https://note-article-api.webrich60.deno.net";

        const CATEGORIES = [ { id: 'business', label: 'ビジネス', icon: 'briefcase', color: 'text-amber-700' }, { id: 'tech', label: 'テック', icon: 'bot', color: 'text-indigo-600' }, { id: 'money', label: 'マネー', icon: 'circle-dollar-sign', color: 'text-yellow-600' }, { id: 'career', label: 'キャリア', icon: 'rocket', color: 'text-rose-600' }, { id: 'creative', label: '制作', icon: 'palette', color: 'text-pink-600' }, { id: 'lifestyle', label: '生活', icon: 'leaf', color: 'text-green-600' }, { id: 'health', label: '健康', icon: 'smile', color: 'text-orange-600' }, { id: 'relationship', label: '人間関係', icon: 'message-circle', color: 'text-purple-600' } ];

        function init() { lucide.createIcons(); loadProfilesList(); renderStepIndicator(); renderCategories(); renderPrices(); setupEvents(); checkLogin(); }
        function checkLogin() { if (localStorage.getItem('appLoggedIn') === 'true') { showApp(); } else { showLogin(); } }
        function showApp() { document.getElementById('login-container').classList.add('hidden'); document.getElementById('app-container').classList.remove('hidden'); document.body.classList.remove('items-center'); const u = JSON.parse(localStorage.getItem('appUserInfo') || '{}'); if (u.picture) { const img = document.getElementById('user-profile-img'); img.src = u.picture; img.classList.remove('hidden'); } }
        function showLogin() { document.getElementById('login-container').classList.remove('hidden'); document.getElementById('app-container').classList.add('hidden'); document.body.classList.add('items-center'); }
        function logout() { if(confirm("ログアウトしますか？")) { localStorage.removeItem('appLoggedIn'); showLogin(); } }
        function loginSuccess(u) { localStorage.setItem('appLoggedIn', 'true'); localStorage.setItem('appUserInfo', JSON.stringify(u)); showApp(); }
        
        function switchAuthMode(m) { authMode = m; document.getElementById('tab-register').className = m === 'register' ? "pb-2 px-4 font-bold text-[#41C9B4] border-b-2 border-[#41C9B4]" : "pb-2 px-4 font-bold text-gray-400 border-b-2 border-transparent"; document.getElementById('tab-login').className = m === 'login' ? "pb-2 px-4 font-bold text-[#41C9B4] border-b-2 border-[#41C9B4]" : "pb-2 px-4 font-bold text-gray-400 border-b-2 border-transparent"; document.getElementById('auth-submit-btn').innerText = m === 'register' ? "新規登録" : "ログイン"; if (m === 'login') { document.getElementById('forgot-password-container').classList.remove('hidden'); } else { document.getElementById('forgot-password-container').classList.add('hidden'); } }

        function handleEmailAuth(e) { e.preventDefault(); const em = document.getElementById('auth-email').value; const pw = document.getElementById('auth-password').value; let us = JSON.parse(localStorage.getItem('appUsers') || '{}'); if (authMode === 'register') { if (us[em]) { showAlert("登録済みです。"); return; } if (pw.length < 6) { showAlert("6文字以上必要です。"); return; } us[em] = { password: pw, name: em.split('@')[0] }; localStorage.setItem('appUsers', JSON.stringify(us)); loginSuccess({ name: em.split('@')[0], picture: '' }); } else { const u = us[em]; if (!u || u.password !== pw) { showAlert("間違いがあります。"); return; } loginSuccess({ name: u.name, picture: '' }); } }

        function loadProfilesList() { const s = localStorage.getItem('articleProfilesList'); if (s) { try { savedProfiles = JSON.parse(s); } catch(e) { savedProfiles = {}; } } updateDropdown(); }
        function updateDropdown() { const sel = document.getElementById('profile-select'); const cur = sel.value; sel.innerHTML = '<option value="">-- 新規作成 --</option>'; for (const k in savedProfiles) { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); } if (savedProfiles[cur]) sel.value = cur; }
        function loadSelectedProfile() { const k = document.getElementById('profile-select').value; if (k && savedProfiles[k]) { Object.assign(formData, savedProfiles[k]); ['name', 'job', 'experience', 'tone', 'strength', 'niche', 'forbidden', 'aftertaste-other'].forEach(id => { const el = document.getElementById('input-' + id); let dk = id; if(id === 'job') dk = 'jobTitle'; else if(id === 'niche') dk = 'nicheThemes'; else if(id === 'forbidden') dk = 'forbiddenWords'; else if(id === 'aftertaste-other') dk = 'aftertasteOther'; if(el) el.value = formData[dk] || ''; }); const af = formData.aftertaste || '共感'; const rb = document.querySelector(`input[name="aftertaste"][value="${af}"]`); if(rb) rb.checked = true; validate1(); } else { clearProfileForm(); } }
        function saveCurrentProfile() { if (!formData.name || !formData.jobTitle || !formData.experience) { showAlert("必須項目を入力してください"); return; } let k = document.getElementById('profile-select').value || prompt("保存名を入れてください", ""); if (!k) return; savedProfiles[k] = { ...formData }; localStorage.setItem('articleProfilesList', JSON.stringify(savedProfiles)); updateDropdown(); document.getElementById('profile-select').value = k; showAlert("保存しました！"); }
        function deleteSelectedProfile() { const k = document.getElementById('profile-select').value; if (!k) return; if (confirm("削除しますか？")) { delete savedProfiles[k]; localStorage.setItem('articleProfilesList', JSON.stringify(savedProfiles)); updateDropdown(); clearProfileForm(); } }
        function clearProfileForm() { ['name', 'job', 'experience', 'tone', 'strength', 'niche', 'forbidden', 'aftertaste-other'].forEach(id => { const el = document.getElementById('input-' + id); if(el) el.value = ''; let dk = id; if(id === 'job') dk = 'jobTitle'; else if(id === 'niche') dk = 'nicheThemes'; else if(id === 'forbidden') dk = 'forbiddenWords'; else if(id === 'aftertaste-other') dk = 'aftertasteOther'; formData[dk] = ''; }); formData.aftertaste = '共感'; const rb = document.querySelector(`input[name="aftertaste"][value="共感"]`); if(rb) rb.checked = true; document.getElementById('profile-select').value = ''; validate1(); }

        function exportData(k, f) { const d = localStorage.getItem(k); if (!d) return; const b = new Blob([d], { type: 'application/json' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = f; a.click(); }
        function importData(k, c) { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = e => { const f = e.target.files[0]; const r = new FileReader(); r.onload = ev => { try { JSON.parse(ev.target.result); localStorage.setItem(k, ev.target.result); showAlert("読み込み完了"); if (c) c(); } catch (er) { showAlert("無効です"); } }; r.readAsText(f); }; i.click(); }

        function setupEvents() { 
            ['name', 'job', 'experience', 'tone', 'strength', 'niche', 'forbidden', 'aftertaste-other'].forEach(id => { const el = document.getElementById('input-' + id); if (el) el.addEventListener('input', e => { let k = id; if(id === 'job') k = 'jobTitle'; else if(id === 'niche') k = 'nicheThemes'; else if(id === 'forbidden') k = 'forbiddenWords'; else if(id === 'aftertaste-other') k = 'aftertasteOther'; formData[k] = e.target.value; validate1(); }); });
            document.querySelectorAll('input[name="aftertaste"]').forEach(r => { r.addEventListener('change', e => { formData.aftertaste = e.target.value; }); });
            document.querySelectorAll('input[name="approach"]').forEach(r => { r.addEventListener('change', e => { formData.approach = e.target.value; }); });
            const kwEl = document.getElementById('input-keyword'); if (kwEl) kwEl.addEventListener('input', e => { formData.keyword = e.target.value; validate3(); });
            document.getElementById('btn-next-to-2').addEventListener('click', () => goToStep(2));
            document.getElementById('btn-next-to-3').addEventListener('click', () => goToStep(3)); 
            document.getElementById('btn-generate-ideas').addEventListener('click', handleIdeas);
            document.getElementById('btn-generate-article').addEventListener('click', handleArticle);
        }
        
        function validate1() { const v = formData.name && formData.jobTitle && formData.experience; const b = document.getElementById('btn-next-to-2'); b.disabled = !v; b.className = v ? "w-full max-w-md py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-[#41C9B4] text-white shadow-md" : "w-full max-w-md py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-gray-300 text-gray-500 cursor-not-allowed shadow-none"; }
        function validate3() { const v = !!formData.keyword; const b = document.getElementById('btn-generate-ideas'); b.disabled = !v; b.className = v ? "flex-1 max-w-sm py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-[#41C9B4] text-white shadow-md" : "flex-1 max-w-sm py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-gray-300 text-gray-500 cursor-not-allowed shadow-none"; }
        function goToStep(s) { currentStep = s; renderStepIndicator(); for(let i=1; i<=5; i++) { const el = document.getElementById('step-'+i); if(el) el.classList.toggle('hidden-step', i !== s); } window.scrollTo(0, 0); }
        function renderStepIndicator() { const s = ['プロフ', 'カテゴリ', 'キーワード', '案', '完成']; let h = '<div class="absolute left-0 top-1/2 w-full h-[1px] bg-gray-200"></div>'; s.forEach((l, i) => { const n = i + 1; const act = currentStep === n; const pas = currentStep > n; h += `<div class="relative z-10 bg-white px-2 py-1 flex flex-col items-center"><div class="w-7 h-7 rounded-full border-2 flex items-center justify-center font-bold text-xs ${act ? 'border-[#41C9B4] text-[#41C9B4] shadow-sm' : pas ? 'bg-[#41C9B4] border-[#41C9B4] text-white' : 'border-gray-300 text-gray-400 bg-gray-50'}">${pas?'✓':n}</div><span class="text-[9px] mt-1.5 ${act ? 'font-bold text-gray-800' : 'text-gray-400'}">${l}</span></div>`; }); document.getElementById('step-indicator').innerHTML = h; }
        
        function renderCategories() { document.getElementById('category-container').innerHTML = CATEGORIES.map(c => `<button onclick="selectCat('${c.id}')" class="flex flex-col items-center p-4 border-2 rounded-xl transition-all ${formData.categoryId===c.id?'border-[#41C9B4] bg-teal-50 shadow-inner':'border-gray-100 hover:border-gray-300 hover:shadow-sm bg-white'}"><i data-lucide="${c.icon}" class="mb-2 w-6 h-6 ${c.color}"></i><span class="text-xs font-bold text-gray-700">${c.label}</span></button>`).join(''); lucide.createIcons(); }
        function selectCat(id) { formData.categoryId = id; renderCategories(); const b = document.getElementById('btn-next-to-3'); b.disabled = false; b.className = "flex-1 max-w-sm py-3 rounded-full font-bold flex justify-center items-center gap-2 bg-[#41C9B4] text-white shadow-md"; }
        function renderPrices() { const T = [{id:'free',l:'無料'},{id:'300',l:'300円'},{id:'500_800',l:'500円〜'},{id:'1000_2000',l:'1000円〜'},{id:'3000_',l:'3000円〜'}]; document.getElementById('price-container').innerHTML = T.map(t => `<button onclick="selectPrice('${t.id}')" class="p-3 border-2 rounded-xl text-xs font-bold transition-all ${formData.priceId===t.id?'border-[#41C9B4] bg-teal-50 shadow-inner text-teal-800':'border-gray-100 bg-white text-gray-600'}">${t.l}</button>`).join(''); }
        function selectPrice(id) { formData.priceId = id; renderPrices(); }

        window.suggestKeywords = async function() {
            const cat = (CATEGORIES.find(x => x.id === formData.categoryId) || {label:'指定なし'}).label;
            const kw = document.getElementById('input-keyword').value || '指定なし';
            const con = document.getElementById('keyword-suggestions-container');
            con.classList.remove('hidden'); con.innerHTML = '<div class="text-teal-600 text-sm">トレンド分析中...</div>';
            const p = `あなたはnoteのマーケティング専門家です。カテゴリ「${cat}」において需要が高い具体的キーワード5つと、有効なハッシュタグ5つを以下のJSON形式のみで出力してください。{"keywords": ["キーワード1", "キーワード2", "キーワード3", "キーワード4", "キーワード5"], "hashtags": ["#タグ1", "#タグ2", "#タグ3", "#タグ4", "#タグ5"]}`;
            try { const res = await callAPI(p, true); const d = Array.isArray(res) ? res[0] : res; let h = '<div><p class="text-xs font-bold text-gray-500 mb-2">クリックで入力</p><div class="flex flex-wrap gap-2">'; d.keywords.forEach(k => { h += `<button onclick="applyKeyword('${k}')" class="text-sm bg-white border border-teal-300 text-teal-800 px-3 py-1.5 rounded-lg hover:bg-teal-100 transition-colors shadow-sm">${k}</button>`; }); h += '</div><p class="text-xs font-bold text-gray-500 mt-4 mb-2">おすすめハッシュタグ</p><div class="flex flex-wrap gap-2">'; d.hashtags.forEach(t => { h += `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded">${t}</span>`; }); h += '</div></div>'; formData.suggestedTags = d.hashtags.join(' '); con.innerHTML = h; } catch (e) { con.innerHTML = '<p class="text-sm text-red-500">失敗しました</p>'; }
        };
        window.applyKeyword = function(k) { document.getElementById('input-keyword').value = k; formData.keyword = k; validate3(); };

        function buildProfileContext() { let t = `名前: ${formData.name}\n職業: ${formData.jobTitle}\n経験: ${formData.experience}\n文体: ${formData.tone}\n強み: ${formData.strength}\nテーマ: ${formData.nicheThemes}\n`; let af = formData.aftertaste; if(af === 'その他' && formData.aftertasteOther) af = formData.aftertasteOther; if(af) t += `読後感: ${af}\n`; if(formData.forbiddenWords) t += `禁止語: ${formData.forbiddenWords}\n`; return t; }

        async function callAPI(p, j = false) { 
            const r = await fetch(BACKEND_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: p, isJson: j }) }); 
            if (!r.ok) throw new Error("通信失敗"); 
            const d = await r.json(); 
            let t = d.candidates?.[0]?.content?.parts?.[0]?.text || d.text; 
            if (j) { 
                t = t.replace(/```json/g, '').replace(/```/g, '').trim(); 
                let o = JSON.parse(t); 
                return Array.isArray(o) ? o : [o]; 
            } 
            return t; 
        }

        async function handleIdeas() {
            goToStep(4); document.getElementById('step-4-loading').classList.remove('hidden'); document.getElementById('step-4-content').classList.add('hidden');
            try {
                const cat = (CATEGORIES.find(x=>x.id===formData.categoryId) || {label:'一般'}).label;
                const ctx = buildProfileContext();
                const apps = { 'empathy': '【感情・ストーリー重視】共感を引き出す', 'authority': '【論理・ノウハウ重視】専門性を押し出す', 'controversy': '【反常識・問題提起】バズを狙う', 'column': '【コラム・エッセイ重視】人柄を伝える日記形式' };
                const app = apps[formData.approach];
                const p = `あなたはトップコピーライターです。${ctx}\nアプローチ: ${app}\nカテゴリ: ${cat}\nテーマ: ${formData.keyword}\n感情を揺さぶりクリックしたくなるタイトル案を3つ。著者の経験を必ず組み込むこと。必ずJSON配列形式：[{"title":"題","catchphrase":"キャッチ","outline":["見出し"]}]`;
                generatedIdeas = await callAPI(p, true); renderIdeas(); document.getElementById('step-4-loading').classList.add('hidden'); document.getElementById('step-4-content').classList.remove('hidden');
            } catch (e) { showAlert("Error: " + e.message); goToStep(3); }
        }
        function renderIdeas() { document.getElementById('ideas-container').innerHTML = generatedIdeas.map((id, i) => `<div onclick="selectIdea(${i})" class="p-5 border-2 rounded-xl cursor-pointer transition-all ${selectedIdeaIndex===i?'border-[#41C9B4] bg-teal-50':'border-gray-200 hover:border-[#41C9B4] bg-white'}"><h4 class="font-bold text-base text-gray-800 mb-1">${id.title}</h4><p class="text-sm text-teal-600 font-medium">${id.catchphrase}</p></div>`).join(''); }
        function selectIdea(i) { selectedIdeaIndex = i; renderIdeas(); const b = document.getElementById('btn-generate-article'); b.disabled = false; b.className = "px-8 py-4 rounded-full font-bold flex justify-center items-center gap-2 bg-[#41C9B4] text-white shadow-md transition-colors hover:bg-[#38b3a0]"; }
        
        async function handleArticle() {
            goToStep(5); document.getElementById('step-5-loading').classList.remove('hidden'); document.getElementById('step-5-content').classList.add('hidden');
            try {
                const id = generatedIdeas[selectedIdeaIndex];
                const ctx = buildProfileContext();
                const app = formData.approach;
                let tags = formData.suggestedTags ? `\n記事末尾にタグを配置：${formData.suggestedTags}` : "";
                const p = `あなたはプロライターです。著者の「ゴーストライター」として執筆してください。一般論は禁止。${ctx}\nタイトル: ${id.title}\n構成: ${id.outline.join('、')}\n1. 具体的なエピソードを肉付けする。2. 文体を守る。3. 禁止語は使わない。4. 読後感を得られるように締める。5. Markdown記号（#や*）は一切禁止。「■」や「▼」を見出しに使う自然なテキスト形式で出力。${tags}`;
                const art = await callAPI(p, false); document.getElementById('final-article-content').value = art; saveHistory(art, id); document.getElementById('step-5-loading').classList.add('hidden'); document.getElementById('step-5-content').classList.remove('hidden');
            } catch (e) { showAlert("Error: " + e.message); goToStep(4); }
        }
        
        function saveHistory(t, idea) { let h = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]'); h.unshift({ id: Date.now(), date: new Date().toLocaleString(), title: idea.title, content: t }); localStorage.setItem('articleCreatorHistory', JSON.stringify(h.slice(0, 30))); }
        function openHistoryModal() { const h = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]'); document.getElementById('history-list').innerHTML = h.map(i => `<div onclick="showHistory('${i.id}')" class="p-4 mb-3 border border-gray-200 rounded-xl hover:border-[#41C9B4] cursor-pointer shadow-sm bg-white transition-all"><div class="text-[10px] text-gray-400 mb-1">${i.date}</div><div class="text-sm font-bold text-gray-800 leading-snug">${i.title}</div></div>`).join('') || '<div class="text-center p-8 text-gray-400"><p class="text-sm">履歴なし</p></div>'; lucide.createIcons(); document.getElementById('history-modal').classList.remove('hidden'); }
        function showHistory(id) { const h = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]'); const i = h.find(x => x.id == id); document.getElementById('history-detail-empty').classList.add('hidden'); document.getElementById('history-detail-content').classList.remove('hidden'); document.getElementById('history-detail-title').innerText = i.title; document.getElementById('history-article-body').innerText = i.content; }
        function closeHistoryModal() { document.getElementById('history-modal').classList.add('hidden'); }
        
        function copyToClipboard(id) { const ta = document.getElementById(id); ta.select(); document.execCommand('copy'); let h = JSON.parse(localStorage.getItem('articleCreatorHistory') || '[]'); if(h.length > 0) { h[0].content = ta.value; localStorage.setItem('articleCreatorHistory', JSON.stringify(h)); } showAlert("コピー完了！編集内容も履歴に保存しました。"); }
        function copyHistoryToClipboard() { const el = document.createElement('textarea'); el.value = document.getElementById('history-article-body').innerText; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); showAlert("コピーしました！"); }
        function resetApp() { formData.keyword = ''; document.getElementById('input-keyword').value = ''; selectedIdeaIndex = null; goToStep(1); }
        init();
    </script>
</body>
</html>
